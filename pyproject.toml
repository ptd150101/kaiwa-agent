[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiwa-voice-agent-poc"
version = "0.1.0"
description = "Pipecat-based Japanese kaiwa voice-agent proof of concept"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx[socks]>=0.28,<1",
  "openai>=1.68,<3",
  "pipecat-ai[openai,runner,silero,soniox,webrtc]>=1.7.0,<2",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
kaiwa-show-role = "kaiwa_poc.show_role:main"
kaiwa-report = "kaiwa_poc.report_cli:main"
kaiwa-text-demo = "kaiwa_poc.text_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaiwa_poc = ["scenarios.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
